name: Portable Calibration instrument
on:
  pull_request:
    paths:
      - 'instrument.json'
      - 'CITATION.cff'
      - 'scripts/build_instrument_surface.py'
      - 'tests/test_instrument_surface.py'
      - 'docs/INSTRUMENT_SURFACE.md'
      - '.github/workflows/instrument-surface.yml'
      - 'src/mcur/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrument:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test,exchange]'
      - name: Core calibration + instrument tests
        run: python -m pytest -q tests/test_calibration.py tests/test_export_boundaries.py tests/test_instrument_surface.py --junitxml=instrument-tests.xml
      - name: Generate source-bound portable verification
        run: python scripts/build_instrument_surface.py --junit instrument-tests.xml --output-dir instrument-evidence
      - name: Require zero failures/errors/skips and canonical result
        run: |
          python - <<'PY'
          import json,xml.etree.ElementTree as E
          suites=list(E.parse('instrument-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) >= 30
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ('failures','errors','skipped'))
          report=json.load(open('instrument-evidence/verification.json'))
          assert report['schema']=='notations.verification.v1'
          assert report['canonical_result']['corrected_value']==7.0
          assert abs(report['canonical_result']['variance']-22.35)<1e-12
          assert report['operation_id']=='mcur.affine-first-order.v1'
          PY
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-instrument-${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            instrument-tests.xml
            instrument-evidence/
